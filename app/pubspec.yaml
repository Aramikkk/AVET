name: avet
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.5+20208

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  yaml: ^3.1.4
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/emblem.png
    - assets/avet_wordmark.svg
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-800.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-600.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-800.ttf
          weight: 800
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-500.ttf
          weight: 500
        - asset: assets/fonts/GolosText-700.ttf
          weight: 700
        - asset: assets/fonts/GolosText-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Emoji
      fonts:
        - asset: assets/fonts/Emoji.ttf
